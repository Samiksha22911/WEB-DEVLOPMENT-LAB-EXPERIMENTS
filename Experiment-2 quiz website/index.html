<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuizMaster - Home</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">QuizMaster</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="leaderboard.html">Leaderboard</a>
        </div>
    </nav>


    <main class="home-container">

        <section class="hero">
            <h1>Test Your Knowledge</h1>

            <p>
                Challenge yourself with a timed quiz and compete
                for the highest score.
            </p>
        </section>


        <section class="setup-card">

            <h2>Start Quiz</h2>

            <div class="form-group">
                <label for="playerName">Your Name</label>

                <input
                    type="text"
                    id="playerName"
                    placeholder="Enter your name"
                    maxlength="30"
                >
            </div>


            <div class="form-group">

                <label for="category">Category</label>

                <select id="category">

                    <option value="9">
                        General Knowledge
                    </option>

                    <option value="18">
                        Computers
                    </option>

                    <option value="19">
                        Mathematics
                    </option>

                    <option value="17">
                        Science
                    </option>

                    <option value="23">
                        History
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="difficulty">
                    Difficulty
                </label>

                <select id="difficulty">

                    <option value="easy">
                        Easy
                    </option>

                    <option value="medium">
                        Medium
                    </option>

                    <option value="hard">
                        Hard
                    </option>

                </select>

            </div>


            <button
                class="primary-btn"
                onclick="startQuiz()"
            >
                Start Quiz
            </button>

        </section>


        <section class="weather-preview">

    <h2>Live Weather</h2>

    <div
        id="homeWeather"
        class="weather-result"
    >
        Detecting your location...
    </div>

</section>


    </main>


    <script src="script.js"></script>
    <script src="weather.js"></script>

</body>
</html>
