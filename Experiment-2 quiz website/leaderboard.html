<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>QuizMaster - Leaderboard</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <nav class="navbar">

        <div class="logo">
            QuizMaster
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="leaderboard.html">
                Leaderboard
            </a>

        </div>

    </nav>


    <main class="leaderboard-container">

        <section class="leaderboard-card">

            <h1>Leaderboard</h1>

            <p class="leaderboard-description">
                Top quiz scores stored in your browser.
            </p>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Rank</th>

                            <th>Player</th>

                            <th>Score</th>

                            <th>Time</th>

                            <th>Date</th>

                        </tr>

                    </thead>


                    <tbody id="leaderboardBody">

                    </tbody>

                </table>

            </div>


            <div class="leaderboard-actions">

                <a
                    href="index.html"
                    class="primary-btn"
                >
                    Play Quiz
                </a>


                <button
                    onclick="clearLeaderboard()"
                    class="danger-btn"
                >
                    Clear Leaderboard
                </button>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
